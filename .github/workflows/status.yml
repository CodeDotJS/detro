name: Status

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  group: status-bake
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pack station status
        run: python3 src/lib/offline/build_status.py
      - name: Commit the pack
        run: |
          set -euo pipefail
          git add data/en/status.json
          if git diff --cached --quiet; then
            echo "status pack unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$(cat <<'EOF'
          chore(status): bake station closures

          EOF
          )"
          git push
