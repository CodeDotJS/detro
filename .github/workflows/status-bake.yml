name: Status

# Clock is Cloudflare Worker detro-status-ping (cron → this dispatch).
# GitHub Actions schedule never registered on this repo; do not rely on it.
on:
  workflow_dispatch:

concurrency:
  group: status-bake
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A personal token so the bake PR triggers CI. GITHUB_TOKEN pushes do not.
          token: ${{ secrets.STATUS_BAKE_TOKEN }}
      - name: Pack station status
        run: python3 src/lib/offline/build_status.py
      - name: Open a pull request for the pack
        env:
          GH_TOKEN: ${{ secrets.STATUS_BAKE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "STATUS_BAKE_TOKEN is missing. Add a classic PAT with repo scope as that secret." >&2
            exit 1
          fi
          if git diff --quiet -- data/en/status.json data/en/status-history.json; then
            echo "status pack unchanged"
            exit 0
          fi
          cp data/en/status.json /tmp/status.json
          cp data/en/status-history.json /tmp/status-history.json
          branch="chore/status-bake"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$branch" origin/main
          cp /tmp/status.json data/en/status.json
          cp /tmp/status-history.json data/en/status-history.json
          git add data/en/status.json data/en/status-history.json
          if git diff --cached --quiet; then
            echo "status pack unchanged on main"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          chore(status): bake station closures

          EOF
          )"
          git push -u origin "$branch" --force
          pr=$(gh pr list --head "$branch" --base main --json number --jq '.[0].number // empty')
          if [ -z "${pr}" ]; then
            url=$(gh pr create --base main --head "$branch" \
              --title "chore(status): bake station closures" \
              --body "$(cat <<'EOF'
          ## Summary
          - Refresh `data/en/status.json` and `data/en/status-history.json` from the DMRC bake

          ## Test plan
          - [ ] Status pack loads after merge
          - [ ] Closed list matches the bake
          - [ ] History chart reflects the day

          EOF
          )")
            pr=$(echo "${url}" | grep -oE '[0-9]+$')
          fi
          echo "Waiting for check on PR ${pr}"
          for _ in $(seq 1 60); do
            if gh pr checks "${pr}" 2>/dev/null | awk '$1 == "check" { found=1 } END { exit !found }'; then
              break
            fi
            sleep 5
          done
          gh pr checks "${pr}" --watch
          state=$(gh pr checks "${pr}" 2>/dev/null | awk '$1 == "check" { print $2; found=1 } END { if (!found) exit 1 }')
          if [ "${state}" != "pass" ]; then
            echo "check is '${state:-missing}', not pass" >&2
            exit 1
          fi
          gh pr merge "${pr}" --merge
          echo "Merged PR ${pr}"
